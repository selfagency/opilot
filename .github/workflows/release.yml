name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release — plain major.minor.patch (e.g. 1.2.3). Use odd minor for pre-release (0.1.x), even minor for stable (0.2.x).'
        required: true
        type: string
      pre_release:
        description: 'Publish as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-tag:
    name: Detect release tag and readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: write
      actions: read

    outputs:
      release_tag: ${{ steps.tag.outputs.release_tag }}
      ready: ${{ steps.tag.outputs.ready }}
      is_prerelease: ${{ steps.tag.outputs.is_prerelease }}
      run_tests: ${{ steps.tag.outputs.run_tests }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve tag from successful workflow runs
        id: tag
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            let tagName;

            if (context.eventName === 'workflow_dispatch') {
              const versionInput = '${{ inputs.version }}'.trim();
              if (!versionInput) {
                core.setFailed('version input is required for workflow_dispatch.');
                return;
              }
              tagName = versionInput.startsWith('v') ? versionInput : `v${versionInput}`;
              const semver = tagName.replace(/^v/, '');

              // Bump package.json version and commit to main
              const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
              const prevVersion = pkg.version;

              // Set git identity
              const { execSync } = require('child_process');
              execSync('git config user.name "github-actions[bot]"', { cwd: process.env.GITHUB_WORKSPACE });
              execSync('git config user.email "41898282+github-actions[bot]@users.noreply.github.com"', { cwd: process.env.GITHUB_WORKSPACE });

              const today = new Date().toISOString().split('T')[0];
              let bumpCommitSha = null;

              if (prevVersion !== semver) {
                pkg.version = semver;
                fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
                core.info(`Bumped package.json: ${prevVersion} → ${semver}`);
              } else {
                core.info(`package.json version already ${semver}.`);
              }

              // Update CHANGELOG.md: stamp versioned heading before [Unreleased]
              let changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
              changelog = changelog.replace('## [Unreleased]', `## [Unreleased]\n\n## [${semver}] - ${today}`);
              fs.writeFileSync('CHANGELOG.md', changelog);
              core.info(`Updated CHANGELOG.md with ${semver} heading.`);

              // Commit files locally
              execSync('git add package.json CHANGELOG.md', { cwd: process.env.GITHUB_WORKSPACE });
              execSync(`git commit -m "chore(release): bump to ${semver}"`, { cwd: process.env.GITHUB_WORKSPACE });
              bumpCommitSha = execSync('git rev-parse HEAD', { cwd: process.env.GITHUB_WORKSPACE }).toString().trim();

              // Push via PR (branch protection blocks direct pushes to main)
              const bumpBranch = `release-bump-${semver}`;
              try {
                await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${bumpBranch}`, sha: bumpCommitSha });
              } catch {
                // Branch already exists from prior attempt; force-update it
                await github.rest.git.updateRef({ owner, repo, ref: `heads/${bumpBranch}`, sha: bumpCommitSha, force: true });
              }

              const { data: pr } = await github.rest.pulls.create({
                owner, repo,
                title: `chore(release): bump to ${semver}`,
                head: bumpBranch,
                base: 'main',
                body: `Automated version bump for ${semver} release.`
              });
              core.info(`Created PR #${pr.number} for version bump.`);

              // Auto-merge the PR
              try {
                await github.rest.pulls.merge({ owner, repo, pull_number: pr.number, merge_method: 'merge' });
                core.info(`Auto-merged PR #${pr.number}.`);

                // Delete the branch
                try { await github.rest.git.deleteRef({ owner, repo, ref: `heads/${bumpBranch}` }); } catch {}
              } catch (mergeErr) {
                core.warning(`Could not auto-merge PR #${pr.number}: ${mergeErr.message}. Manual merge required.`);
              }

              // Resolve HEAD of main (now includes the bump merge)
              const main = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
              const mainSha = main.data.commit.sha;

              // Check if tag already exists before creating
              try {
                await github.rest.git.getRef({ owner, repo, ref: `tags/${tagName}` });
                core.setFailed(`Release blocked: tag ${tagName} already exists. Delete it first or bump version.`);
                return;
              } catch {
                // Tag doesn't exist — proceed to create
              }

              // Create the tag via API
              core.info(`Creating tag ${tagName} at ${mainSha}...`);
              try {
                await github.rest.git.createRef({
                  owner,
                  repo,
                  ref: `refs/tags/${tagName}`,
                  sha: mainSha,
                });
                core.info(`Tag ${tagName} created.`);
              } catch (createErr) {
                if (createErr.status === 422) {
                  core.setFailed(`Release blocked: unable to create tag ${tagName} — likely already exists. Delete the tag first or bump version.`);
                } else {
                  throw createErr;
                }
                return;
              }
            } else {
              tagName = context.ref.replace('refs/tags/', '');
            }

            if (!tagName || !tagName.startsWith('v')) {
              core.info(`Ref '${context.ref}' is not a release tag; skipping.`);
              core.setOutput('release_tag', '');
              core.setOutput('ready', 'false');
              return;
            }

            const refData = await github.rest.git.getRef({
              owner,
              repo,
              ref: `tags/${tagName}`,
            });

            const refObj = refData.data.object;
            const taggedSha =
              refObj.type === 'tag'
                ? (await github.rest.git.getTag({ owner, repo, tag_sha: refObj.sha })).data.object.sha
                : refObj.sha;
            const main = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
            const mainSha = main.data.commit.sha;

            if (taggedSha !== mainSha) {
              core.setFailed(
                `Release blocked: tag ${tagName} points to ${taggedSha}, but latest main is ${mainSha}.`
              );
              return;
            }

            // If no successful CI run found for this commit, run tests inline.
            const ciRuns = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: 'ci.yml',
              head_sha: mainSha,
              status: 'completed',
              per_page: 5,
            });
            const successfulRun = ciRuns.data.workflow_runs.find(r => r.conclusion === 'success');
            if (!successfulRun) {
              core.info(`No successful CI run found for ${mainSha}. Tests will run in the release job.`);
              core.setOutput('run_tests', 'true');
            } else {
              core.info(`CI run ${successfulRun.id} passed for commit ${mainSha}.`);
              core.setOutput('run_tests', 'false');
            }

            core.info(`Release tag detected: ${tagName} on latest main commit ${mainSha}; tag verified.`);
            const isPrerelease = tagName.includes('-') || (context.eventName === 'workflow_dispatch' && '${{ inputs.pre_release }}' === 'true');
            core.setOutput('release_tag', tagName);
            core.setOutput('ready', 'true');
            core.setOutput('is_prerelease', String(isPrerelease));

  release:
    name: Build and Release
    needs: detect-tag
    if: needs.detect-tag.outputs.release_tag != '' && needs.detect-tag.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write
      deployments: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.detect-tag.outputs.release_tag }}
          fetch-depth: 0

      - name: Generate release notes for changelog
        id: changelog_notes
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const currentTag = '${{ needs.detect-tag.outputs.release_tag }}';

            const tagsResp = await github.rest.repos.listTags({
              owner,
              repo,
              per_page: 100,
            });
            const tags = tagsResp.data;

            const index = tags.findIndex(tag => tag.name === currentTag);
            const previousTag =
              index >= 0
                ? (tags.slice(index + 1).find(tag => tag.name.startsWith('v'))?.name ?? '')
                : '';

            const notesResponse = await github.rest.repos.generateReleaseNotes({
              owner,
              repo,
              tag_name: currentTag,
              ...(previousTag ? { previous_tag_name: previousTag } : {}),
              target_commitish: 'main',
            });

            core.info(
              previousTag
                ? `Generated changelog notes from ${previousTag} to ${currentTag}.`
                : `Generated changelog notes for ${currentTag} (no previous tag found).`
            );

            core.setOutput('previous_tag', previousTag);
            core.setOutput('notes', notesResponse.data.body ?? '');

      - name: Write release notes to file
        run: printf '%s' "$RELEASE_NOTES" > release-notes.md
        env:
          RELEASE_NOTES: ${{ steps.changelog_notes.outputs.notes }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup task runner
        uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2.1.0
        with:
          version: "3.x"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests (no successful CI run for this commit)
        if: needs.detect-tag.outputs.run_tests == 'true'
        run: task check-types && task lint && task unit-tests

      - name: Build extension package
        run: xvfb-run -a task compile

      - name: Package extension
        run: |
          if [ "${{ needs.detect-tag.outputs.is_prerelease }}" = "true" ]; then
            pnpm dlx @vscode/vsce package --pre-release --no-dependencies --out opilot.vsix
          else
            pnpm dlx @vscode/vsce package --no-dependencies --out opilot.vsix
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.detect-tag.outputs.release_tag }}
          body_path: release-notes.md
          files: 'opilot.vsix'
          draft: false
          prerelease: ${{ needs.detect-tag.outputs.is_prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create VS Code Marketplace deployment (pre-release)
        id: deploy_vsce_pre
        if: needs.detect-tag.outputs.is_prerelease == 'true'
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: '${{ needs.detect-tag.outputs.release_tag }}',
              environment: 'vscode-marketplace',
              description: 'Publish pre-release to VS Code Marketplace',
              auto_merge: false,
              required_contexts: [],
              production_environment: false,
            });
            core.setOutput('deployment_id', deployment.data.id);

      - name: Publish pre-release to VS Code Marketplace
        id: publish_vsce_pre
        if: needs.detect-tag.outputs.is_prerelease == 'true'
        run: pnpm dlx @vscode/vsce publish --pre-release --packagePath opilot.vsix -p ${{ secrets.VSCE_PAT }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Update VS Code Marketplace deployment status (pre-release)
        if: always() && needs.detect-tag.outputs.is_prerelease == 'true' && steps.deploy_vsce_pre.outputs.deployment_id != ''
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const outcome = '${{ steps.publish_vsce_pre.outcome }}';
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.deploy_vsce_pre.outputs.deployment_id }},
              state: outcome === 'success' ? 'success' : 'failure',
              description: `VS Code Marketplace pre-release publish ${outcome}`,
              environment_url: 'https://marketplace.visualstudio.com/items?itemName=selfagency.opilot',
              auto_inactive: false,
            });

      - name: Create Open VSX deployment (pre-release)
        id: deploy_ovsx_pre
        if: needs.detect-tag.outputs.is_prerelease == 'true'
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: '${{ needs.detect-tag.outputs.release_tag }}',
              environment: 'open-vsx',
              description: 'Publish pre-release to Open VSX Registry',
              auto_merge: false,
              required_contexts: [],
              production_environment: false,
            });
            core.setOutput('deployment_id', deployment.data.id);

      - name: Publish pre-release to Open VSX
        id: publish_ovsx_pre
        if: needs.detect-tag.outputs.is_prerelease == 'true'
        run: pnpm dlx ovsx publish opilot.vsix --pre-release -p ${{ secrets.OVSX_PAT }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: Update Open VSX deployment status (pre-release)
        if: always() && needs.detect-tag.outputs.is_prerelease == 'true' && steps.deploy_ovsx_pre.outputs.deployment_id != ''
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const outcome = '${{ steps.publish_ovsx_pre.outcome }}';
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.deploy_ovsx_pre.outputs.deployment_id }},
              state: outcome === 'success' ? 'success' : 'failure',
              description: `Open VSX pre-release publish ${outcome}`,
              environment_url: 'https://open-vsx.org/extension/selfagency/opilot',
              auto_inactive: false,
            });

      - name: Create VS Code Marketplace deployment
        id: deploy_vsce
        if: needs.detect-tag.outputs.is_prerelease != 'true'
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: '${{ needs.detect-tag.outputs.release_tag }}',
              environment: 'vscode-marketplace',
              description: 'Publish to VS Code Marketplace',
              auto_merge: false,
              required_contexts: [],
              production_environment: true,
            });
            core.setOutput('deployment_id', deployment.data.id);

      - name: Publish to VS Code Marketplace
        id: publish_vsce
        if: needs.detect-tag.outputs.is_prerelease != 'true'
        run: pnpm dlx @vscode/vsce publish --packagePath opilot.vsix -p ${{ secrets.VSCE_PAT }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Update VS Code Marketplace deployment status
        if: always() && needs.detect-tag.outputs.is_prerelease != 'true' && steps.deploy_vsce.outputs.deployment_id != ''
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const outcome = '${{ steps.publish_vsce.outcome }}';
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.deploy_vsce.outputs.deployment_id }},
              state: outcome === 'success' ? 'success' : 'failure',
              description: `VS Code Marketplace publish ${outcome}`,
              environment_url: 'https://marketplace.visualstudio.com/items?itemName=selfagency.opilot',
              auto_inactive: false,
            });

      - name: Create Open VSX deployment
        id: deploy_ovsx
        if: needs.detect-tag.outputs.is_prerelease != 'true'
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: '${{ needs.detect-tag.outputs.release_tag }}',
              environment: 'open-vsx',
              description: 'Publish to Open VSX Registry',
              auto_merge: false,
              required_contexts: [],
              production_environment: true,
            });
            core.setOutput('deployment_id', deployment.data.id);

      - name: Publish to Open VSX
        id: publish_ovsx
        if: needs.detect-tag.outputs.is_prerelease != 'true'
        run: pnpm dlx ovsx publish opilot.vsix -p ${{ secrets.OVSX_PAT }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: Update Open VSX deployment status
        if: always() && needs.detect-tag.outputs.is_prerelease != 'true' && steps.deploy_ovsx.outputs.deployment_id != ''
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const outcome = '${{ steps.publish_ovsx.outcome }}';
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.deploy_ovsx.outputs.deployment_id }},
              state: outcome === 'success' ? 'success' : 'failure',
              description: `Open VSX publish ${outcome}`,
              environment_url: 'https://open-vsx.org/extension/selfagency/opilot',
              auto_inactive: false,
            });

      - name: Rollback on failure — revert bump via PR, delete tag and release
        if: failure() && github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.detect-tag.outputs.release_tag }}
        run: |
          set -e
          owner="${{ github.repository_owner }}"
          repo="opilot"
          tag="$TAG"

          # Revert the bump commit via PR (branch protection blocks direct push)
          git fetch origin main
          git checkout main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git revert HEAD --no-edit; then
            revert_sha=$(git rev-parse HEAD)
            revert_branch="rollback-${tag}"
            # Create/update branch via API
            curl -s -X POST \
              -H "Authorization: token ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github.v3+json" \
              -H "Content-Type: application/json" \
              -d "{\"ref\":\"refs/heads/${revert_branch}\",\"sha\":\"${revert_sha}\"}" \
              "https://api.github.com/repos/${owner}/${repo}/git/refs" > /dev/null 2>&1 || \
              curl -s -X PATCH \
                -H "Authorization: token ${GITHUB_TOKEN}" \
                -H "Accept: application/vnd.github.v3+json" \
                -H "Content-Type: application/json" \
                -d "{\"sha\":\"${revert_sha}\",\"force\":true}" \
                "https://api.github.com/repos/${owner}/${repo}/git/refs/heads/${revert_branch}" > /dev/null 2>&1 || true
            pr_resp=$(curl -s \
              -H "Authorization: token ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github.v3+json" \
              -H "Content-Type: application/json" \
              -d "{\"title\":\"revert: bump to ${tag} (release failed)\",\"head\":\"${revert_branch}\",\"base\":\"main\",\"body\":\"Reverting automated bump from failed release ${tag}.\"}" \
              "https://api.github.com/repos/${owner}/${repo}/pulls")
            pr_number=$(echo "$pr_resp" | jq -r '.number')
            if [ -n "$pr_number" ] && [ "$pr_number" != "null" ]; then
              curl -s -X PUT \
                -H "Authorization: token ${GITHUB_TOKEN}" \
                -H "Accept: application/vnd.github.v3+json" \
                -d '{"merge_method":"merge"}' \
                "https://api.github.com/repos/${owner}/${repo}/pulls/${pr_number}/merge" > /dev/null 2>&1 && \
                echo "Revert merged via PR #${pr_number}." || echo "Revert PR auto-merge failed; manual merge required."
              # Delete the branch
              curl -s -X DELETE \
                -H "Authorization: token ${GITHUB_TOKEN}" \
                "https://api.github.com/repos/${owner}/${repo}/git/refs/heads/${revert_branch}" > /dev/null 2>&1 || true
            fi
          else
            echo "No bump commit to revert."
            git revert --abort 2>/dev/null || true
          fi

          # Delete the git tag
          curl -s -X DELETE \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${owner}/${repo}/git/refs/tags/${tag}" \
            && echo "Deleted tag ${tag}." || echo "Failed to delete tag ${tag}."

          # Delete the GitHub Release if it was created
          release_id=$(curl -s \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${owner}/${repo}/releases/tags/${tag}" \
            | jq -r '.id // empty')
          if [ -n "$release_id" ] && [ "$release_id" != "null" ]; then
            curl -s -X DELETE \
              -H "Authorization: token ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${owner}/${repo}/releases/${release_id}" \
              && echo "Deleted release ${tag}." || echo "Failed to delete release."
          fi
