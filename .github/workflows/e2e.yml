name: e2e

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate
      - name: Install dependencies
        run: pnpm install
      - name: Build extension
        run: pnpm run compile
      - name: Run e2e
        run: |
          # Ensure WDIO receives the --enable-proposed-api flag when launching VS Code in CI
          export WDIO_VSCODE_ARGS="--enable-proposed-api=selfagency.opilot"
          pnpm run e2e
        env:
          CI: true
      - name: Upload artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: ./wdio-report || ./screenshots || ./trace
